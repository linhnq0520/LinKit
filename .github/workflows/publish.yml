name: publish

# Tag pattern: v<version> (for example v3.4.0). Versions live in the csproj files, which are the
# single source of truth; the tag is only a trigger. The twelve packages are versioned
# independently, so the tag names the release line via LinKit.Core rather than every package.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate packages without pushing to nuget.org"
        type: boolean
        default: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for NuGet trusted publishing / OIDC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore LinKit/LinKit.sln

      - name: Build
        run: >
          dotnet build LinKit/LinKit.sln --no-restore -c Release
          -warnaserror:RS2002,IL2026,IL2060,IL2067,IL2072,IL2075,IL2091,IL3050

      - name: Test
        run: dotnet test LinKit/LinKit.sln --no-build -c Release

      # Packing into a directory that may already hold an earlier build is how a stale version
      # gets pushed by mistake, so the output directory starts empty.
      - name: Pack
        run: |
          rm -rf artifacts/packages
          dotnet pack LinKit/LinKit.sln -c Release -o artifacts/packages

      # Fails the release if the tag does not name a version that was actually built. LinKit.Core
      # identifies the release line because it is the package every other one depends on.
      - name: Verify tag matches LinKit.Core version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          core_pkg="artifacts/packages/LinKit.Core.${tag}.nupkg"
          echo "Tag version: $tag"
          ls -1 artifacts/packages/*.nupkg
          if [ ! -f "$core_pkg" ]; then
            echo "::error::Tag v$tag does not match the LinKit.Core version that was built. Bump LinKit.Core or retag to a built version."
            exit 1
          fi

      # Each package is checked against its own version: the file name must agree with the nuspec,
      # and the version must not move a package backwards relative to nuget.org. A version that is
      # already published is reported instead of failing, so a partially completed release can be
      # re-run safely (the push step uses --skip-duplicate).
      - name: Verify package versions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail=0
          count=0
          for pkg in artifacts/packages/*.nupkg; do
            case "$pkg" in *.snupkg) continue ;; esac
            count=$((count + 1))
            base=$(basename "$pkg" .nupkg)
            nuspec=$(unzip -p "$pkg" '*.nuspec' | tr -d '\r\n')
            id=$(sed -n 's:.*<id>\([^<]*\)</id>.*:\1:p' <<< "$nuspec")
            ver=$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' <<< "$nuspec")
            if [ -z "$id" ] || [ -z "$ver" ]; then
              echo "::error file=$pkg::Could not read id and version from the nuspec."
              fail=1
              continue
            fi
            if [ "$base" != "$id.$ver" ]; then
              echo "::error file=$pkg::File name does not match nuspec id $id version $ver."
              fail=1
              continue
            fi
            published=$(curl -fsS --retry 2 "https://api.nuget.org/v3-flatcontainer/${id,,}/index.json" \
              | jq -r '.versions | last // empty' || true)
            if [ -z "$published" ]; then
              echo "$id $ver (not on nuget.org yet)"
            elif [ "$ver" = "$published" ]; then
              echo "::warning file=$pkg::$id $ver is already on nuget.org and will be skipped."
            elif [ "$(printf '%s\n%s\n' "$published" "$ver" | sort -V | head -n1)" = "$ver" ]; then
              echo "::error file=$pkg::$id $ver is older than the published $published."
              fail=1
            else
              echo "$id $ver (published: $published)"
            fi
          done
          expected=$(find LinKit -name '*.csproj' -not -path '*/obj/*' -not -path '*/bin/*' \
            | xargs -r -n1 basename \
            | grep -E '^LinKit\.' \
            | grep -vE '\.(Generator|Tests|AotSmoke)\.csproj$' \
            | wc -l)
          echo "Packed $count of $expected packable projects."
          if [ "$count" -ne "$expected" ]; then
            echo "::error::Expected $expected packages but found $count."
            fail=1
          fi
          exit $fail

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ github.ref_name }}
          path: artifacts/packages

      - name: Publish to nuget.org
        if: github.event_name == 'push' || inputs.dry_run == false
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pkg in artifacts/packages/*.nupkg; do
            case "$pkg" in *.snupkg) continue ;; esac
            dotnet nuget push "$pkg" \
              --api-key "${{ secrets.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Publish symbol packages
        if: github.event_name == 'push' || inputs.dry_run == false
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pkg in artifacts/packages/*.snupkg; do
            dotnet nuget push "$pkg" \
              --api-key "${{ secrets.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/packages/*.nupkg
          generate_release_notes: true
